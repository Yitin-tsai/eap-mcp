server:
  port: 8083

spring:
  application:
    name: eap-mcp

  cloud:
    openfeign:
      client:
        config:
          order-recovery-source:
            connect-timeout: 2000
            read-timeout: 5000
          wallet-recovery-source:
            connect-timeout: 2000
            read-timeout: 5000
          match-recovery-source:
            connect-timeout: 2000
            read-timeout: 5000

  datasource:
    url: ${EAP_MCP_DB_URL:jdbc:postgresql://localhost:5432/eapdb}
    username: ${EAP_MCP_DB_USERNAME:admin}
    password: ${EAP_MCP_DB_PASSWORD:admin123}
    hikari:
      connection-timeout: ${EAP_DB_CONNECTION_TIMEOUT_MS:2000}

  liquibase:
    enabled: ${EAP_RECOVERY_DB_ENABLED:${EAP_RECOVERY_CONTROL_ENABLED:false}}
    change-log: classpath:db/changelog/db.changelog-master.xml

  rabbitmq:
    host: ${EAP_RABBITMQ_HOST:localhost}
    port: ${EAP_RABBITMQ_PORT:5672}
    username: ${EAP_RABBITMQ_USERNAME:admin}
    password: ${EAP_RABBITMQ_PASSWORD:admin123}

  # Spring AI MCP configuration
  ai:
    mcp:
      server:
        enabled: true
        name: "EAP Trading MCP Server"
        version: "1.0.0"
        type: SYNC
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

# External service configurations
eap:
  order-service:
    base-url: http://localhost:8080/eap-order
  
  wallet:
    base-url: http://localhost:8081/eap-wallet

  match-engine:
    base-url: http://localhost:8082/match-engine

  recovery-control:
    enabled: ${EAP_RECOVERY_CONTROL_ENABLED:false}
    operator-token: ${EAP_RECOVERY_OPERATOR_TOKEN:}
    source-token: ${EAP_RECOVERY_SOURCE_TOKEN:}
    max-actions-per-operator-minute: 10
    broker-dlq:
      enabled: ${EAP_RECOVERY_BROKER_DLQ_ENABLED:false}
      queue: order.dlq

# MCP Server configuration
mcp:
  server:
    name: "EAP Trading MCP Server"
    version: "1.0.0"
    description: "Model Context Protocol Server for EAP Electricity Trading Platform"
    max-connections: 100
    timeout: 30s
    # MCP 協議端點
    endpoints:
      base-path: "/mcp"
      sse-path: "/sse"
      websocket-path: "/ws"
  
  # Rate limiting configuration
  rate-limit:
    enabled: true
    requests-per-minute: 60
    burst-capacity: 10
  
  # Audit configuration
  audit:
    enabled: true
    log-level: INFO
    include-request-body: true
    include-response-body: false

# Logging configuration
logging:
  level:
    com.eap.mcp: DEBUG
    org.springframework.ai: DEBUG
    feign: DEBUG
    io.modelcontextprotocol: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

# Management endpoints
management:
  health:
    db:
      enabled: ${EAP_RECOVERY_DB_ENABLED:${EAP_RECOVERY_CONTROL_ENABLED:false}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
