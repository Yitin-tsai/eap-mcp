plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eap'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    // EAP Common DTOs
    implementation 'com.eap:eap-common:1.0.0'
    
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.liquibase:liquibase-core'
    
    // 正確的 MCP Server WebMVC Starter
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    
    // HTTP Client for calling order-service
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    
    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Logging and metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.1'
        // 使用最新的 Spring AI GA 版本
        mavenBom "org.springframework.ai:spring-ai-bom:1.1.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'eap.integration.postgres', System.getProperty('eap.integration.postgres', 'false')
}

tasks.register('postgresIntegrationTest', Test) {
    group = 'verification'
    description = 'Run PostgreSQL-backed recovery control-plane audit and broker quarantine tests.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.postgres', 'true'
    systemProperty 'api.version', System.getProperty('api.version', '1.40')
    include '**/*PostgresIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('rabbitIntegrationTest', Test) {
    group = 'verification'
    description = 'Run RabbitMQ-backed broker dead-letter replay publisher tests.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.rabbit', 'true'
    systemProperty 'api.version', System.getProperty('api.version', '1.40')
    include '**/*RabbitIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('brokerDeadLetterSeed', JavaExec) {
    group = 'verification'
    description = 'Publish one deterministic REL-107 captured-DLQ fixture to RabbitMQ.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.mcp.recovery.BrokerDeadLetterSeedPublisher'
    dependsOn tasks.named('testClasses')
}
